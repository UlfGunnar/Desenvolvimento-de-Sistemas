<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de alunos</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center; 
            height: 100vh;
            background-image: url('image.png');
            background-size: cover;
            background-position: center;
        }
        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: rgba(245, 245, 245, 0.418);
            height: auto;
            width: 400px;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 5px 5px 5px rgba(0, 0, 0, 0.342);
        }
        h2 {
            margin-bottom: 15px;
        }
        input{
            margin: 10px 5px;
        }
        .button {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 15px;
            background-color: pink;
            width: 150px;
            height: 30px;
            padding: 2px;
            border-radius: 20px;
            border: 1px solid rgba(0, 0, 0, 0.445);
            text-decoration: none;
            text-shadow: 1px 1px 1px rgba(0, 0, 0, 0.514);
            color: white;
        }
        .button:hover {
            background-color: rgb(255, 155, 171);
        }
        .button:active {
            background-color: rgb(211, 110, 127);
        }
        a:hover {
            background-color: rgb(255, 155, 171);
        }
        a:active {
            background-color: rgb(211, 110, 127);
        }
        a {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 15px;
            background-color: pink;
            width: 150px;
            height: 30px;
            padding: 2px;
            border-radius: 20px;
            border: 1px solid rgba(0, 0, 0, 0.445);
            text-decoration: none;
            text-shadow: 1px 1px 1px rgba(0, 0, 0, 0.514);
            color: white;
        }
    </style>
</head>
<body>
    <main>
        <h2>Cadastro de Alunos</h2>
        <form action="../backend/dados.php" method="get">
            <label for="inome">Nome: </label>
            <input type="text" name="nome" id="inome" required>
            <fieldset>
                <legend>Notas</legend>
                <input type="number" name="nota_1" id="" placeholder="Nota 1" step="0.1" min="0" max="10" required>
                <input type="number" name="nota_2" id="" placeholder="Nota 2" step="0.1" min="0" max="10" required>
                <input type="number" name="nota_3" id="" placeholder="Nota 3" step="0.1" min="0" max="10" required>
            </fieldset>
            <input type="submit" value="Cadastrar" class="button">
            
        </form>
        <a href="view.php">Visualizar alunos</a>
    </main>
</body>
</html>
