<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD de Alunos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="card card-larga">
    <h1>CRUD de Alunos</h1>

    <section>
        <h2>Cadastrar</h2>
        <form action="salvar.php" method="POST">
            <label>Nome</label>
            <input name="nome" type="text" required>

            <label>E-mail</label>
            <input name="email" type="email" required>

            <label>Curso</label>
            <input name="curso" type="text" required>

            <label>Data de Nascimento</label>
            <input type="date" name="data_nascimento" required>

            <label>Cidade</label>
            <input type="text" name="cidade" required>

            <label>Periodo</label>
            <input type="text" name="periodo">

            <button type="submit">Salvar</button>
        </form>
    </section>

    <section>
        <h2>Excluir</h2>
        <form action="deletar.php" method="POST">
            <label>ID</label>
            <input name="id" type="number" min="1" required>

            <button type="submit">Excluir</button>
        </form>
    </section>

    <section>
        <h2>Consultar</h2>
        <form action="consultar.php" method="GET">
            <label>ID (opcional)</label>
            <input name="id" type="number" min="1">

            <label>Nome</label>
            <input type="text" name="nome">

            <button type="submit">Consultar</button>
        </form>
    </section>
</main>
</body>
</html>
