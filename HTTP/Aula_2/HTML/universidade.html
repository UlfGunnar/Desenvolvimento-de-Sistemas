<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../CSS/style.css">
</head>
<body>
    <header>
        <a href="index.html" class="card_right">⭠ Cadastrar Aluno</a>
    </header>
    <main class="card">
        <h1>Cadastro de Universidade</h1>
        <form action="../PHP/salvar_universidade.php" method="post">
            <label for="inome">Nome</label>
            <input type="text" name="nome" id="inome" required>

            <label for="icnpj">CNPJ</label>
            <input type="text" name="CNPJ" id="icnpj" minlength="14" maxlength="14" required>

            <label for="itelefone">Telefone</label>
            <input type="text" name="telefone" id="itelefone" minlength="11" maxlength="11" required>

            <label for="irua">Rua</label>
            <input type="text" name="rua" id="irua" required>

            <label for="ibairro">Bairro</label>
            <input type="text" name="bairro" id="ibairro" required>

            <label for="inumero">Número</label>
            <input type="text" name="numero" id="inumero" maxlength="4" required>

            <button type="submit">Salvar</button>
        </form>
    </main>
</body>
</html>
