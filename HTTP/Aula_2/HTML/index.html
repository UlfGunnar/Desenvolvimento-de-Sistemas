<!DOCTYPE html>
<html lang="pt-br">
<head>                      
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cdastrp de Aluno</title>
    <link rel="stylesheet" href="../CSS/style.css">
</head>
<body>
    <header>
        <a href="universidade.html" class="card_left">Cadastrar Universidade ⭢</a>
    </header>
    <main class="card">
        <h1>Cadastro de Aluno</h1>
        <form action="../PHP/salvar.php" method="post">
            <label for="inome">Nome</label>
            <input type="text" name="nome" id="inome" required>

            <label for="icpf">CPF</label>
            <input type="text" name="CPF" id="icpf" minlength="11" maxlength="11" required>

            <label for="idata">Data de Nascimento</label>
            <input type="date" name="data_nascimento" id="idata" required>

            <label for="iemail">E-mail</label>
            <input type="email" name="email" id="iemail" required >

            <label for="itelefone">Telefone</label>
            <input type="text" name="telefone" id="itelefone" minlength="11" maxlength="11" required>

            <label for="icurso">Curso</label>
            <input type="text" name="curso" id="icurso" required>

            <label for="iturma">Turma</label>
            <input type="text" name="turma" id="iturma" required>

            <label for="irua">Rua</label>
            <input type="text" name="rua" id="irua" required>

            <label for="ibairro">Bairro</label>
            <input type="text" name="bairro" id="ibairro" required>

            <label for="inumero">Número</label>
            <input type="text" name="numero" id="inumero" maxlength="4" required>

            <button type="submit">Salvar</button>

            <a href="" class="read">Vizualizar Alunos</a>
        </form>
    </main>
</body>
</html>
